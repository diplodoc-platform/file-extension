# Transform 5 companion prereleases only. This workflow is not generated by infra.
name: Transform 5 companion prerelease

on:
  push:
    branches:
      - codex/transform-5-compat-prerelease

permissions:
  contents: read
  id-token: write

concurrency:
  group: transform-5-companion-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'diplodoc-platform/file-extension' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/transform-5-compat-prerelease'
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: '@diplodoc/file-extension'
      PACKAGE_VERSION: '0.2.7-transform5.0'
      DIST_TAG: transform5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up exact Node.js release
        uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate prerelease identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.equal(process.version, 'v24.15.0');
          assert.equal(process.env.GITHUB_REPOSITORY, 'diplodoc-platform/file-extension');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/codex/transform-5-compat-prerelease');
          assert.equal(process.env.PACKAGE_NAME, '@diplodoc/file-extension');
          assert.equal(process.env.PACKAGE_VERSION, '0.2.7-transform5.0');
          assert.equal(process.env.DIST_TAG, 'transform5');
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(manifest.name, process.env.PACKAGE_NAME);
          assert.equal(manifest.version, process.env.PACKAGE_VERSION);
          assert.equal(lock.name, manifest.name);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].name, manifest.name);
          assert.equal(lock.packages[''].version, manifest.version);
          NODE

      - name: Require unpublished prerelease
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(
            'https://registry.npmjs.org/' +
              encodeURIComponent(process.env.PACKAGE_NAME) + '/' + process.env.PACKAGE_VERSION
          );
          assert.equal(response.status, 404, 'Only a confirmed absent prerelease may be published');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify installed package where supported
        run: npm run test:package --if-present

      - name: Verify release inputs stayed unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Recheck unpublished prerelease
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(
            'https://registry.npmjs.org/' +
              encodeURIComponent(process.env.PACKAGE_NAME) + '/' + process.env.PACKAGE_VERSION
          );
          assert.equal(response.status, 404, 'The prerelease appeared while checks were running');
          NODE

      - name: Publish only to the transform5 dist-tag
        run: npm publish --tag transform5 --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
